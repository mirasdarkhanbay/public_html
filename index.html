<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алатау Фуд: HR-миссия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-width column, a lift directory board; each floor opens as its own screen. Deliberately single dark "night over Alatau" look. */
  --night:#0f1830;--panel:#17223f;--panel2:#1f2d52;--line:#2e3f6c;
  --snow:#eef2f8;--mist:#9aabc8;
  --amber:#f3b23a;--apple:#e5483b;--mint:#2fc193;--sky:#6fa8ff;
  --paper:#f6efe2;--ink:#1b2440;--inkmute:#5b6687;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--night);color:var(--snow);font:15px/1.45 var(--body);padding-inline:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:6px 28px;position:relative}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--night);z-index:5}
#hud .l{justify-self:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px;color:var(--mist)}
#hud .c{font-size:11px;color:var(--mist);letter-spacing:.1em;text-transform:uppercase;text-align:center;font-weight:700}
#hud .r{justify-self:end;display:flex;gap:10px;align-items:center}
.hearts{color:var(--apple);letter-spacing:3px;font-size:19px;line-height:1}.hearts .off{color:var(--line)}
.score{font:800 16px var(--display);font-variant-numeric:tabular-nums;position:relative;color:var(--amber)}
.mute{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--mist);border-radius:8px;padding:4px 8px;font:600 11px var(--body);cursor:pointer}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05;font-weight:800}
h1 span{color:var(--amber);font-size:.6em;font-weight:700;display:block;margin-top:8px}
h2{font-size:25px;font-weight:800;line-height:1.15}
h3{font-size:17px;font-weight:700;line-height:1.3}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sub{color:var(--mist);font-size:14px}
.lead{color:var(--snow);opacity:.9}
.scr{display:flex;flex-direction:column;gap:14px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.sky{display:block;width:100%;height:180px;border-radius:16px;border:1px solid var(--line)}
.sky.small{height:130px}
.btn{display:block;width:100%;padding:15px 16px;border-radius:12px;border:0;background:var(--amber);color:var(--ink);font:700 14px var(--display);cursor:pointer;letter-spacing:.02em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--snow)}
label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:700}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--snow);padding:13px 14px;border-radius:10px;font:500 16px var(--body)}
.field{display:flex;flex-direction:column;gap:6px}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;color:var(--mist);line-height:1.3}
.facts b{display:block;font:800 22px var(--display);color:var(--snow)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* map */
.safe{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.safe>span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:700}
.digits{display:flex;gap:6px}
.digits b{width:30px;height:40px;display:grid;place-items:center;font:800 18px var(--display);background:var(--night);border:1px solid var(--line);border-radius:7px;color:var(--line)}
.digits b.on{color:var(--amber);border-color:var(--amber)}
.digits.big{justify-content:center}
.digits.big b{width:44px;height:60px;font-size:28px}
.board{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.board-h,.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.board-h{padding:8px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);border-bottom:1px solid var(--line);font-weight:700}
.row{padding:12px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;font:inherit}
.row:last-child{border-bottom:0}
.fn{font:800 24px var(--display);color:var(--mist)}
.rt b{display:block;font-weight:700}
.rt span{font-size:12px;color:var(--mist)}
.st{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--mist)}
.row.next{background:var(--panel2);cursor:pointer}
.row.next .fn{color:var(--amber)}
.row.next .st{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.row.done .fn,.row.done .st{color:var(--mint)}
.row.done .st{border-color:rgba(47,193,147,.45)}
.row.lock{opacity:.5}
.link{background:none;border:0;color:var(--sky);font:600 13px var(--body);cursor:pointer;text-align:left;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.link.center{text-align:center}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--snow)}

/* intro + results */
.introtop{display:flex;gap:14px;align-items:center}
.bignum{font:800 68px/1 var(--display);color:var(--amber)}
.gamecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.story{font-size:15px;border-left:3px solid var(--amber);padding-left:12px}
.stars{font-size:36px;color:var(--amber);letter-spacing:6px;line-height:1}
.stars span{color:var(--line)}
.digitcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--amber)}
.digitcard span{color:var(--mist);font-size:13px;font-weight:600}
.digitcard b{font:800 52px/1 var(--display);color:var(--amber);animation:flip .7s .15s both}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}

/* shared game parts */
.game{display:flex;flex-direction:column;gap:12px}
.ghead{display:flex;flex-direction:column;gap:4px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--mint)}
.bar i.low{background:var(--apple)}
.opts{display:grid;gap:8px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--snow);font:600 14px/1.3 var(--body);cursor:pointer;min-height:54px;min-width:0}
.opt span{min-width:0}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt kbd{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--panel2);color:var(--mist);font:700 11px var(--body)}
.opt.ok{background:rgba(47,193,147,.18);border-color:var(--mint)}
.opt.no{background:rgba(229,72,59,.2);border-color:var(--apple);animation:shake .35s}
.opt:disabled{cursor:default}
.opt.big{justify-content:center;font-size:16px;min-height:62px}
.ask{font-weight:700}
.combo{color:var(--amber);font:700 12px var(--display);text-align:center;min-height:1.3em}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* catcher */
.cv-wrap canvas{width:100%;height:auto;display:block;border-radius:14px;touch-action:none;border:1px solid var(--line)}
.pad{display:flex;gap:10px}
.padb{flex:1;padding:13px;font-size:20px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--snow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.padb:active{background:var(--panel2)}
.hint{font-size:12px;color:var(--mist);text-align:center}

/* matching */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.match line{stroke:var(--mint);stroke-width:2.5;stroke-linecap:round}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mb{min-height:62px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--snow);font:600 13.5px/1.25 var(--body);cursor:pointer;text-align:center;position:relative;z-index:1}
.col.models .mb{font:700 11.5px/1.25 var(--display);letter-spacing:.02em}
.mb.sel{border-color:var(--amber);background:#3a3524}
.mb.done{border-color:var(--mint);background:#15383a;color:var(--mint);cursor:default}
.mb.no{border-color:var(--apple);animation:shake .35s}

/* person card */
.person{position:relative;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 12px;align-items:center;overflow:hidden}
.ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);color:#fff;background:hsl(var(--h) 50% 40%)}
.pmeta b{display:block;font-weight:700;font-size:16px}
.pmeta span{font-size:12px;color:var(--inkmute)}
.quote{grid-column:1/-1;margin-top:8px;font-size:15px;line-height:1.45}
.stamp{position:absolute;right:12px;top:14px;font:800 12px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:2px solid;border-radius:6px;transform:rotate(-8deg);opacity:0}
.stamp.ok{color:#178a64;opacity:1}
.stamp.no{color:#c4362b;opacity:1}

/* detective file */
.file{background:var(--paper);color:var(--ink);border-radius:4px 14px 14px 14px;padding:16px}
.file-tag{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#7a6a4a;margin-bottom:6px}
.case{font-size:15px;font-weight:600;line-height:1.45}
.ev{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ev li{display:grid;grid-template-columns:86px 62px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;border-top:1px dashed #cdbf9f;padding-top:6px}
.evn{font-weight:700}
.evv{font-weight:800;font-size:10.5px;text-transform:uppercase;padding:2px 6px;border-radius:4px;text-align:center}
.evv.hi{background:#d6efe4;color:#14704f}
.evv.lo{background:#f6dcd7;color:#a3312a}
.evd{color:#4b5578}

/* communication */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 11px;border-radius:10px;border:1px dashed var(--line);color:var(--mist);font:700 12px var(--body);min-width:38px;text-align:center}
.slot.f{border-style:solid;border-color:var(--mint);color:var(--snow);background:rgba(47,193,147,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--snow);font:600 14px var(--body);cursor:pointer}
.chip:hover{border-color:var(--sky)}
.chip.no{border-color:var(--apple);animation:shake .35s}
.track{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:16px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.node{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.wire{position:relative;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.pkt{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px rgba(243,178,58,.22);animation:go linear forwards}
@keyframes go{to{left:62%}}
.wall{position:absolute;left:67%;top:50%;width:10px;height:36px;margin-top:-18px;background:var(--apple);border-radius:3px;transition:transform .4s,opacity .4s}
.wall.broken{transform:scaleY(0);opacity:0}

/* boss */
.boss{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;align-items:center}
.bossart svg{width:116px;height:auto;display:block}
.bossart.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-8px) rotate(-4deg);filter:brightness(1.9)}60%{transform:translateX(6px)}}
.bolt{opacity:.2}
.bossart.atk .bolt{animation:bolt .6s}
@keyframes bolt{30%{opacity:1;transform:translateY(5px)}}
.hp{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--apple),var(--amber));transition:width .45s}
.hpn{font-size:12px;color:var(--mist);margin-top:4px;font-variant-numeric:tabular-nums}
.stmt{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px;font-size:16px;font-weight:600;line-height:1.45;min-height:112px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fix{color:var(--amber);font-size:14px;min-height:1.4em}

/* lift */
.liftdoor{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,var(--panel) 49.7%,var(--line) 49.7% 50.3%,var(--panel) 50.3%);border:1px solid var(--line)}
.lnum{font:800 42px/1 var(--display);color:var(--amber)}
.lorder{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.lorder li{font-weight:700;color:var(--mint);background:rgba(47,193,147,.1);border:1px solid rgba(47,193,147,.35);border-radius:10px;padding:8px 12px}
.lorder li b{font-family:var(--display);margin-right:8px}

/* finale */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats dt{font-size:10.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.stats dd{margin:2px 0 0;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.vault{background:var(--panel);border:1px solid var(--amber);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.vault>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:700}
.review{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.review summary{cursor:pointer;font-weight:700}
.review ol{padding-left:18px;margin:10px 0 0;display:grid;gap:12px}
.review p{margin:2px 0}
.rf{font-size:10.5px;color:var(--amber);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.ra{color:var(--mint);font-size:13px}

/* feedback */
#app.hurt::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 4px var(--apple),inset 0 0 90px rgba(229,72,59,.4);animation:fade .5s forwards;z-index:20}
@keyframes fade{to{opacity:0}}
.float{position:absolute;right:0;top:-6px;font:800 13px var(--display);animation:up .9s forwards;pointer-events:none;white-space:nowrap}
.float.g{color:var(--mint)}.float.b{color:var(--apple)}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
@media (prefers-reduced-motion:reduce){*:not(.pkt){animation-duration:.01ms!important;transition:none!important}}
@media (max-width:360px){h1{font-size:28px}.opts.g2{grid-template-columns:1fr}.digits.big b{width:38px;height:52px;font-size:24px}}
</style>

<div id="app">
  <header id="hud"><span class="l" id="hl"></span><span class="c" id="hc"></span><span class="r"><span class="score" id="hs">0</span><button class="mute" id="mute" aria-label="Дыбысты қосу немесе өшіру">Дыбыс ✓</button></span></header>
  <main id="stage"></main>
</div>

<script>
/* ====== Баптау: сейф коды (әр қабат бір сан береді). Қаласаңыз, сандарды өзгертіңіз. ====== */
const CODE=[2,7,1,9,4,6];

/* ====== Лекция мазмұны ====== */
const FLOORS=[
 {n:'Өндіріс цехы',t:'Ұйым және ҰМҚ негіздері',g:'Конвейер',
  story:'Цехта шатасу: жаңа қызметкерлер «ұйым» деген не, ҰМҚ нені зерттейтінін білмейді. Конвейерден дұрыс ұғымдарды іріктеп ал.',
  rule:'Науаны жылжытып, тек тапсырмаға сай қораптарды ұста. Әр толқында 4 дұрыс қорап жина. Қате қорап — минус бір жүрек.'},
 {n:'Басқарма',t:'ҰМҚ модельдері',g:'Модель жұптары',
  story:'Басқарма мүшелері төрт түрлі стильмен басқарып, ұжымды шатастырды. Әр модельдің сипатын орнына қой.',
  rule:'Сол жақтағы модельді оң жақтағы сипатымен жұпта. 4 раунд, әрқайсысына 45 секунд. Қате жұп — минус бір жүрек.'},
 {n:'Ашық кеңсе',t:'Тұлға және мінез-құлық',g:'Кім бұл?',
  story:'Ашық кеңседе ұжым шиеленісіп тұр. Әр қызметкердің мінезін түсінбей, оны басқару мүмкін емес.',
  rule:'Қызметкердің ҰМҚ моделін, темпераментін және қарым-қатынас стилін анықта. Әр карточкаға 14 секунд. Қатарынан дұрыс жауап комбо бонус береді.'},
 {n:'HR кабинеті',t:'Қабылдау және атрибуция',g:'Детектив',
  story:'HR-ға шағым түсті: менеджерлер қызметкерлерді әділетсіз бағалайды. Тергеу жүргіз.',
  rule:'Алдымен Келли критерийлері бойынша себепті тап: ішкі ме, сыртқы ма? Сосын менеджердің қабылдау қатесін әшкерле.'},
 {n:'Байланыс орталығы',t:'Коммуникация',g:'Сигнал',
  story:'Бөлімдер арасындағы хабарлар жолда жоғалып жатыр. Байланысты қалпына келтір.',
  rule:'Алдымен коммуникация үрдісін ретімен құрастыр. Сосын хабар қабылдаушыға жетпей тұрып, жолындағы кедергінің түрін анықта.'},
 {n:'Директор кабинеті',t:'Мәдениет, DEI, мотивация',g:'Босс: Дағдарыс',
  story:'Соңғы кедергі — Дағдарыс. Компания мәдениетін, инклюзиясын және мотивациясын қорғап, оны жең.',
  rule:'Әр тұжырымға «Дұрыс» не «Жалған» деп жауап бер (← → пернелері де жұмыс істейді). Қатарынан дұрыс жауап соққыны күшейтеді. 10 секунд ішінде үлгер.'}
];

const CATCH=[

 seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(k==='tap'?.04:.09,now+d+.01);g.gain.exponentialRampToValueAtTime(.0001,now+d+.18);o.connect(g).connect(AC.destination);o.start(now+d);o.stop(now+d+.2)})}catch(e){}}

  if(!snow)return;x.fillStyle=snow;for(let k=1;k<pts.length-1;k++){const p0=pts[k-1],p1=pts[k],p2=pts[k+1];if(p1[1]<p0[1]&&p1[1]<p2[1]){const f=.3,A=[p1[0]+(p0[0]-p1[0])*f,p1[1]+(p0[1]-p1[1])*f],B=[p1[0]+(p2[0]-p1[0])*f,p1[1]+(p2[1]-p1[1])*f];

 ridge([[0,.6],[.08,.46],[.17,.55],[.28,.28],[.38,.46],[.47,.37],[.56,.52],[.66,.24],[.76,.43],[.86,.34],[.95,.5],[1,.45]],'#2b3d70','rgba(238,242,248,.88)');
 ridge([[0,.8],[.12,.66],[.22,.76],[.34,.6],[.46,.74],[.6,.64],[.72,.78],[.86,.67],[1,.76]],'#1b284d');
 const bw=Math.min(92,W*.22),bx=W*.66,fh=Math.max(10,(H*.58)/7),gy=H-4,top=gy-6*fh;
 x.fillStyle='#0b1226';x.fillRect(bx,top-10,bw,gy-top+10);x.fillStyle='#f3b23a';x.fillRect(bx+bw*.15,top-22,bw*.7,12);

 for(let f=0;f<6;f++){const y=gy-(f+1)*fh+3;for(let w=0;w<5;w++){const wx=bx+6+w*((bw-12)/5);x.fillStyle=f<lit?'#f3b23a':(f===lit?'#6fa8ff':'#22325c');x.fillRect(wx+1,y,(bw-12)/5-4,fh-6)}}

 function wrap(s,maxW){x.font=FONT;const L=[];let cur='';for(const w of s.split(' ')){const tr=cur?cur+' '+w:w;if(x.measureText(tr).width>maxW&&cur){L.push(cur);cur=w}else cur=tr}L.push(cur);return L}
 function spawnOne(){let lane;do lane=Math.random()*3|0;while(lane===lastLane);lastLane=lane;const ok=Math.random()<.55;const s=ok?P.ok[P.oi++%P.ok.length]:P.bad[P.bi++%P.bad.length];const lines=wrap(s,98);const h=lines.length*16+22;items.push({s,ok,lines,x:6+lane*118,y:-h,w:112,h})}

    el.querySelector('#hp').style.width=hp+'%';el.querySelector('#hpn').textContent=`${hp}/100 · соққы −${dmg}`}
   else{combo=0;if(v>=0)(v?bt:bf).classList.add('no');anim('atk');el.querySelector('#fx').textContent=(v<0?'Уақыт бітті. ':'')+(Q[1]?'Бұл тұжырым — дұрыс.':Q[2]);
    if(!C.bad(Q[0],Q[1]?'Тұжырым дұрыс':'Тұжырым жалған. '+Q[2]))return}
   el.querySelector('#cb').textContent=combo>=2?`Комбо ×${combo} · соққы күшейді`:'';
   if(hp<=0){el.querySelector('#ph').textContent='Дағдарыс жеңілді';after(1100,()=>C.win());return}
   after(right?900:2600,nextQ)}
  bf.onclick=()=>answer(0);bt.onclick=()=>answer(1);
  onKey=k=>{if(k==='arrowleft')answer(0);else if(k==='arrowright')answer(1)};
 }
 nextQ();
}

/* ====== Іске қосу ====== */
try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
function boot(d){const g=d&&d.G;if(g&&g.t0){G=g;G.next>=6?finale():showMap()}else showStart()}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(e){boot({})}
</script>
