<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алатау Фуд: Жол квесті (жаңа сұрақтар)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--fg:#1f2a44}
:root[data-theme="dark"]{--bg:#12182a;--fg:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12182a;--fg:#eef1f6}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Calibri,Segoe UI,Arial,sans-serif;display:flex;justify-content:center}
#w{position:relative;width:100%;max-width:420px}
canvas{display:block;width:100%;height:auto;background:#2b2f3a}
#hud{display:flex;justify-content:space-between;padding:8px 12px;font-weight:700;font-size:15px}
#o{position:absolute;left:0;right:0;top:34px;bottom:0;display:none;flex-direction:column;justify-content:center;padding:14px;background:rgba(20,26,44,.88);color:#fff}
#o h2{margin:0 0 6px;font-size:18px;color:#f5b83d}
#o p{margin:0 0 12px;font-size:16px;line-height:1.35}
#pad{display:flex;gap:10px;padding:8px 12px}#pad button{flex:1;padding:14px;font-size:24px;border:0;border-radius:12px;background:#1f2a44;color:#fff;touch-action:none}#pad button:active{background:#14a38b}#tip{padding:0 12px 12px;font-size:13px;opacity:.75;text-align:center}canvas{touch-action:none}
.b{display:block;width:100%;margin:5px 0;padding:11px;border:2px solid #14a38b;border-radius:10px;background:#1f2a44;color:#fff;font-size:15px;text-align:left;cursor:pointer;font-family:inherit}
.b:hover{background:#2c3a5c}.ok{background:#14a38b!important}.no{background:#e4572e!important;border-color:#e4572e}
.go{background:#f5b83d;color:#1f2a44;font-weight:700;text-align:center;border-color:#f5b83d}
</style></head><body>
<div id="w"><div id="hud"><span id="lv">❤❤❤</span><span id="st">1-кезең</span><span id="sc">0</span></div>
<canvas id="c" width="360" height="520"></canvas><div id="o"></div><div id="pad"><button id="L">◀</button><button id="Rr">▶</button></div><div id="tip">← → / A D пернелері немесе экранды сүйреңіз. Қабырғаға соғылсаңыз, −5 ұпай кетеді.</div></div>
<script>
const S=[
{n:"Ұйым досьесі",d:5,q:[
["Мінез-құлық дегеніміз не?", ["Қоршаған ортаға бейімделуде тірі ағзалар жүзеге асыратын өзара байланысты реакциялар жүйесі", "Тек жұмыс уақытындағы тәртіп", "Ұйымның жылдық есебі", "Тек психологиялық тест нәтижесі"], 0],
["ҰМҚ пәні нені дамытады?", ["Мінез-құлық модельдерін қалыптастыруды және мінез-құлықты басқару дағдыларын", "Бухгалтерлік есеп жүргізуді", "Салық есептеуді", "Тауар сатуды"], 0],
["Пайдаға қатысты ұйым түрі қайсы?", ["Коммерциялық және коммерциялық емес", "Ресми және бейресми", "Мемлекеттік және жеке", "Корпоративті және адхократиялық"], 0],
["Ұйымның сипаттамасына қайсысы жатады?", ["Сыртқы ортамен тұрақты өзара іс-қимыл", "Мақсаттың болмауы", "Құрылымның болмауы", "Тек бір адамның жұмысы"], 0],
["Ұйым ішіндегі қарым-қатынас бойынша түрге қайсысы жатады?", ["Партисипативті", "Муниципалды", "Коммерциялық", "Бейресми"], 0]]},
{n:"Басшының айнасы",d:4,q:[
["ҰМҚ моделі дегеніміз не?", ["Менеджерлердің ойлауындағы басым сенім жүйесі", "Компания логотипі", "Жалақы кестесі", "Қызметкерлер тізімі"], 0],
["Қолдаушылық үлгінің негізі не?", ["Басшылық", "Билік", "Әріптестік", "Экономикалық ресурстар"], 0],
["Алқалық үлгіде жұмыскердің психологиялық нәтижесі қандай?", ["Өзіндік тәртіп", "Басшыға тәуелділік", "Ұйымға тәуелділік", "Басқаруда қатысу"], 0],
["Қорғаншылық үлгіде жұмыскердің еңбек үрдісіне қатысуы қандай?", ["Пассивті әріптестік", "Минималды", "Оянған ынталандыру", "Орташа ынта"], 0],
["Алқалық үлгіде жұмыскердің қажеттілігі қандай?", ["Өзін-өзі жетілдіру қажеттілігі", "Өмір сүру қажеттілігі", "Қауіпсіздік қажеттілігі", "Мәртебе және тану қажеттілігі"], 0]]},
{n:"Қызметкерлер картасы",d:4,q:[
["Ұйымның адал және тәртіпті мүшесі қандай қызметкер?", ["Барлық құндылықтар мен нормаларды қабылдап, ұйым мүддесіне қайшы келмейтін", "Құндылықтарды бөліспейтін және үнемі қақтығыс жасайтын", "Мақсатты бөліседі, бірақ нормаларды бөлмейтін", "Кез келген сәтте ұйымнан кете алатын"], 0],
["Оригинал қызметкерге мінез-құлық таңдауда еркіндік берілсе, не болады?", ["Ұйымға пайда әкелуі мүмкін", "Міндетті түрде жұмыстан кетеді", "Ешқандай өзгеріс болмайды", "Тек қақтығыс туады"], 0],
["Бүлікші қызметкердің ұйымда болуы неге тиімді болуы мүмкін?", ["Арасында дарынды тұлғалар көп, олар үлкен пайда әкеледі", "Олар ешқашан қақтығыс жасамайды", "Олар барлық ережені бұзбай орындайды", "Олар ұйым мақсатына мүлде қызықпайды"], 0],
["Бейімделген қызметкер туралы қайсысы дұрыс?", ["Құндылықтарды бөлмейді, бірақ мінез-құлық нормаларын толық ұстанады", "Нормаларды мүлде қабылдамайды", "Тек шығармашыл жұмысшылар", "Әрдайым қақтығыс жасайды"], 0],
["Менеджер қызметкердің мінез-құлқын басқарғанда не істеуі керек?", ["Жеке ерекшеліктерін ескеріп, мінез-құлқының себептерін анықтауы керек", "Барлығына бірдей бұйрық беруі керек", "Жеке ерекшеліктерді елемеуі керек", "Тек жазалауы керек"], 0]]},
{n:"Тұлға коды",d:3,q:[
["Адам қалай «тұлға» бола бастайды?", ["Индивид болып туылып, өмір барысында әлеуметтік қасиеттерге ие болады", "Тек биологиялық дамумен", "Туған сәтте бірден тұлға болады", "Тек ақша табумен"], 0],
["Платонов бойынша тұлға құрылымындағы кіші құрылымға қайсысы жатады?", ["Жеке бағыт кіші құрылымы", "Жалақы кіші құрылымы", "Ұйымдық кіші құрылым", "Нарықтық кіші құрылым"], 0],
["Бейімделу фазасында қандай алаңдау болады?", ["Жеке ерекшеліктерін жоғалтып алу", "Жалақының төмен болуы", "Жұмыстың көп болуы", "Басшының жас болуы"], 0],
["Даралану фазасына қайсысы тән?", ["Хобби, би арқылы өз даралығын көрсету, референтті топ іздеу", "Тек басқаларға ұқсап кету", "Өз қасиеттерін түгел жасыру", "Жұмыстан кету"], 0],
["Интеграция фазасының мәні қандай?", ["Өз ерекшеліктері мен топ құндылықтары арасындағы қайшылықты шешіп, мақұлданатын қасиеттерді дамыту", "Қауымдастықтың нормаларын жаңадан игеру", "Тек хобби іздеу", "Тек биологиялық даму"], 0]]}];
const c=document.getElementById('c'),x=c.getContext('2d'),o=document.getElementById('o');
let G;const Q=[];
function build(){Q.length=0;S.forEach((s,i)=>{const a=s.q.slice().sort(()=>Math.random()-.5).slice(0,3);a.forEach(q=>Q.push([i,q]))})}
function init(){build();G={st:'q',i:0,ob:null,lives:3,sc:0,t:0,x:180,tx:null,shake:0,jump:0};next()}
function next(){G.ob=null;if(G.i>=Q.length){end(true);return}ask();hud()}
function hud(){lv.textContent='❤'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,3-G.lives));sc.textContent=G.sc;st.textContent=(Q[Math.min(G.i,Q.length-1)][0]+1)+'-кезең'}
function ask(){G.st='q';const [k,[t,a,r]]=Q[G.i];const idx=a.map((_,i)=>i).sort(()=>Math.random()-.5);G.cur={idx,r};G.qt=15;
 o.innerHTML='<h2>'+S[k].n+'</h2><div style="height:8px;background:#444;border-radius:4px;margin-bottom:4px"><div id="tb" style="height:8px;width:100%;background:#14a38b;border-radius:4px"></div></div><div id="tt" style="font-size:13px;text-align:right;margin-bottom:6px">15 с</div><p>'+t+'</p><div style="font-size:12px;opacity:.7;margin-bottom:6px">Жауап беруге 15 секунд. Уақыт бітсе, қате жауап саналады.</div>';
 idx.forEach(j=>{const b=document.createElement('button');b.className='b';b.textContent=a[j];b.onclick=()=>pick(b,j===r,idx,r);o.appendChild(b)});
 o.style.display='flex'}
function pick(b,ok,idx,r){G.qt=null;[...o.querySelectorAll('.b')].forEach((e,n)=>{e.onclick=null;if(idx[n]===r)e.classList.add('ok')});
 if(ok)G.sc+=10;else{if(b)b.classList.add('no');G.lives--;G.shake=1}
 hud();setTimeout(()=>{o.style.display='none';if(G.lives<=0){end(false);return}
  const gw=ok?150:84;G.ob={y:-30,k:Q[G.i][0],gw,gx:48+Math.random()*(264-gw),hit:false};G.st='run'},900)}
function end(win){G.st='over';o.style.display='flex';
 o.innerHTML=win?'<h2>🎉 Сейф ашылды!</h2><p>Код: <b style="font-size:26px;color:#f5b83d">'+S.map(s=>s.d).join('-')+'</b><br>Ұпай: '+G.sc+'<br>Енді өзгеріс жоспарын ұсыныңдар!</p>':'<h2>💥 Апат!</h2><p>Өмір таусылды. Теорияны қайталап, қайта көріңдер. Ұпай: '+G.sc+'</p>';
 const b=document.createElement('button');b.className='b go';b.textContent='Қайта бастау';b.onclick=()=>{o.style.display='none';init();hud()};o.appendChild(b)}
function car(px,py){x.save();x.translate(px,py);x.fillStyle='#e4572e';x.fillRect(-18,-34,36,68);x.fillStyle='#9fd3ff';x.fillRect(-13,-18,26,14);x.fillRect(-13,10,26,8);x.fillStyle='#111';[[-22,-26],[18,-26],[-22,14],[18,14]].forEach(p=>x.fillRect(p[0],p[1],4,14));x.fillStyle='#f5b83d';x.fillRect(-14,-34,6,4);x.fillRect(8,-34,6,4);x.restore()}
function obst(ob){const y=ob.y,k=ob.k;x.save();x.beginPath();x.rect(44,y-30,272,60);x.rect(ob.gx,y-30,ob.gw,60);x.clip('evenodd');x.translate(0,y);
 if(k==0){x.fillStyle='#fff';x.fillRect(44,-14,272,28);x.fillStyle='#e4572e';for(let i=0;i<10;i++)x.fillRect(44+i*28,-14,14,28)}
 else if(k==1){x.fillStyle='#f5b83d';x.fillRect(44,-18,272,36);x.fillStyle='#1f2a44';for(let i=0;i<9;i++){x.beginPath();x.moveTo(44+i*33,18);x.lineTo(64+i*33,-18);x.lineTo(79+i*33,-18);x.lineTo(59+i*33,18);x.fill()}}
 else if(k==2){x.fillStyle='#2a8a60';x.fillRect(44,-18,272,36);x.fillStyle='#fff';x.font='bold 18px Calibri';x.textAlign='center';x.fillText('БЕЙІМДЕЛГЕН · ОРИГИНАЛ · БҮЛІКШІ',180,6)}
 else{x.fillStyle='#14a38b';x.fillRect(44,-24,272,48);x.fillStyle='#fff';x.font='bold 20px Calibri';x.textAlign='center';x.fillText('ТҰЛҒА · ТЕОРИЯ',180,7)}
 x.restore()}
const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const hold=(id,d)=>{const b=document.getElementById(id);b.onpointerdown=()=>K['b'+d]=1;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>K['b'+d]=0};hold('L','l');hold('Rr','r');
const px=e=>{const r=c.getBoundingClientRect();G.tx=(e.clientX-r.left)/r.width*360};c.onpointerdown=px;c.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')px(e)};
let last=0;
function loop(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;
 if(G.st==='q'&&G.qt!=null){G.qt-=dt;const tb=document.getElementById('tb'),tt=document.getElementById('tt');if(tb){tb.style.width=Math.max(0,G.qt/15*100)+'%';tb.style.background=G.qt<5?'#e4572e':'#14a38b';tt.textContent=Math.max(0,Math.ceil(G.qt))+' с'}if(G.qt<=0){pick(null,false,G.cur.idx,G.cur.r)}}
 if(G.st==='run'){G.t+=dt*260;const sp=300*dt;let d=0;
  if(K.arrowleft||K.a||K.bl){d=-1;G.tx=null}if(K.arrowright||K.d||K.br){d=1;G.tx=null}
  if(d)G.x+=d*sp;else if(G.tx!==null){const df=G.tx-G.x;G.x+=Math.max(-sp,Math.min(sp,df))}
  G.x=Math.max(62,Math.min(298,G.x));
  const ob=G.ob;ob.y+=dt*(240+G.i*14);
  if(!ob.hit&&ob.y+16>396&&ob.y-16<464&&(G.x-18<ob.gx||G.x+18>ob.gx+ob.gw)){ob.hit=true;G.sc=Math.max(0,G.sc-5);G.shake=1;hud()}
  if(ob.y>560&&G.st==='run'){if(!ob.hit)G.sc+=5;G.i++;next()}}
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.5);
 x.save();if(G.shake>0)x.translate(Math.sin(ts/20)*6*G.shake,0);
 x.fillStyle='#3a3f4d';x.fillRect(0,0,360,520);x.fillStyle='#2f9e5b';x.fillRect(0,0,40,520);x.fillRect(320,0,40,520);
 x.fillStyle='#fff';x.fillRect(40,0,4,520);x.fillRect(316,0,4,520);
 for(let i=-1;i<9;i++){const yy=(i*70+G.t%70);x.fillRect(118,yy,6,36);x.fillRect(236,yy,6,36)}
 if(G.ob)obst(G.ob);
 car(G.x,430);x.restore();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
</script></body></html>
